[[agent]]
id = "plan"
name = "Plan"
command = "/jockey:plan {task} -- {guidance}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "PLAN-{n}.md"
choose = true
sisters = true
next = ["impl", "discuss"]
on_fail = ["plan"]
instructions = '''
Read ISSUE.md too when the task has a GitHub issue (Jockey copied it there, comments included). Explore the repo and decide an approach. Do not edit code.
When an earlier PLAN exists (planning again after a failed plan, a discussion or a failed step), start from it and from what showed it wrong (the step this one follows, your guidance): keep what still holds, and say right after the TLDR what changed from it and why.
PLAN-{n}.md sections, after the TLDR:
1. Goal: what is wrong or missing today and what will be true once it is done.
2. Where it happens: an archify diagram of the systems this issue involves (PLAN-{n}-context.html): the services, databases, Firebase functions, Pub/Sub topics, queues and outside APIs on its path, and what each sends the next, from the code and config with source evidence, the ones this issue changes marked. The higher-level view the two flows below zoom into.
3. Current flow: an archify diagram of how the code works today (PLAN-{n}-current.html), from the code with source evidence, the part that goes wrong marked.
4. New flow: the same flow with the fix applied and what changes marked (PLAN-{n}-new.html), laid out like the current one so the two compare at a glance.
5. Options, only when there is a real choice (designs, libraries, where the code goes): for each one a small block, short enough to read in a narrow panel: its name in bold with its size (about +N / -M lines), then a line of Pros and a line of Cons, a few words each. Then the one you recommend and why. No table.
6. Files: a table, one row per file to change, with what changes there and why. Under it: "Estimated change: about +N / -M lines".
7. Tests: the behaviours to verify (main path, edge cases, what must not change).
Fail when the task cannot be done as described.'''

[[agent]]
id = "impl"
name = "Implement"
command = "/jockey:implement {task} -- {guidance}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "IMPLEMENT-{n}.md"
revert = true
show_diff = true
sisters = true
on_fail = ["impl", "discuss", "plan"]
instructions = '''
The newest PLAN is the target: its New flow, Files and the option picked. What to do now depends on the step this one follows (Jockey step block):
- after Plan: build the plan's New flow and Files.
- after a failed Review: fix each finding of that REVIEW-n.md that holds.
- after a failed Test: its failing tests show bugs; fix the code, never the tests (TEST-n.md explains each).
- after another failed check (e.g. a regression run): fix the failures its artifact puts on this branch, not the ones it puts on its tools.
- after Copilot, or when the task has a pull request: the comments and failing CI checks in the newest FEEDBACK-n.md (gh pr checks and gh run view --log-failed give the logs).
- after Discuss: what the newest DISCUSS-n.md left to do.
Once a first IMPLEMENT exists, the plan is built: read the earlier IMPLEMENT files to see what was done, and change only what the feedback needs.
IMPLEMENT-{n}.md sections, after the TLDR:
1. What changed: the option taken and why (when the plan has Options), then how each part of the code changed, following the flow.
2. Files: a table, one row per changed file, with what changed in it.
3. Feedback handled, when you handled some: one row each (its file and the finding, comment id or test), fixed or rejected, and why.
4. Notes for the reviewer, when there are any: deviations from the plan, what to look at closely, checks that failed or could not run.
Fail when you could not implement it (say what blocks).'''

[[agent]]
id = "discuss"
name = "Discuss"
command = "/jockey:discuss {task} -- {guidance}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "DISCUSS-{n}.md"
revert = true
show_diff = true
sisters = true
next = ["review", "impl"]
on_fail = ["discuss", "impl"]
instructions = '''
Read the newest PLAN, the newest file of each later step (REVIEW, TEST, FEEDBACK…), and the branch's changes (git diff origin/{base}...HEAD, git status).
This step is a conversation led by the user: they may want to understand something, explore an idea or change code. Do not start working on your own: say in two or three lines where the task stands (the step this one follows and what it found, or the guidance when there is some), then wait for their questions.
Change code only when asked, one change at a time, explaining each briefly.
Write DISCUSS-{n}.md only when the user says the discussion is over: what you discussed and concluded, or what they asked for. If you changed code, add What changed (with the plan's option taken, if any) and Files, for Review.
Fail when the user stops the work.'''

[[agent]]
id = "review"
name = "Review"
command = "/jockey:review {task}"
model = "sonnet"
effort = "medium"
trigger = "after:impl"
writes = "REVIEW-{n}.md"
rerun = true
next = ["test", "impl", "discuss"]
on_fail = ["impl", "discuss"]
instructions = '''
Review the uncommitted changes (git status, git diff HEAD): what changed since Jockey's last commit. Check them against the newest PLAN (its New flow and Files) and the newest IMPLEMENT or DISCUSS file (what it says it changed, and the feedback it says it fixed or rejected). When an earlier REVIEW failed, check that each of its findings is fixed or rightly rejected. Never edit code, and do not ask for tests: Test adds them.
REVIEW-{n}.md: the findings, most important first, each with its file and line and what to change.
Done when the changes are ready, failed when they need changes.'''

[[agent]]
id = "test"
name = "Test"
command = "/jockey:test {task} -- {guidance}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "TEST-{n}.md"
allow = ["Bash(make test-path:*)", "Bash(make ruff:*)"]
next = ["push", "impl", "discuss"]
on_fail = ["impl", "discuss"]
instructions = '''
Read the newest PLAN (its Tests section lists what to verify), the newest IMPLEMENT or DISCUSS file (what changed) and the newest REVIEW (what it flagged). When the step this one follows is a failed TEST, run its failing tests first: they must pass now.
Write tests for the uncommitted changes (git status, git diff HEAD), following the repo's conventions: the plan's Tests, the edge cases and anything the reviews flagged. When the repo has no tests, say so and write none.
First check the tests this branch already added or changed (git diff origin/{base} on the test files): update or remove the ones that no longer match the code. Never change tests that exist on {base}.
Run them. Change only tests: if one shows a bug, keep it failing and explain it.
Report only checks that ran, with the exact command and pass/fail counts. If a run cannot start (no credentials or network), say so; never point tests at real resources to make them run.
In pony-core, once the tests pass, run the regression-tests skill (jockey:regression-tests) too, on the changes under test.
TEST-{n}.md sections, after the TLDR: Tests added, How to run, Results, and Regression (the skill's results) in pony-core.
Done when the tests (and the regression run) pass, failed when one shows a bug.'''

[[agent]]
id = "push"
name = "Push"
command = "/jockey:push {task}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "PUSH.md"
ignore_rules = true
next = ["impl", "discuss"]
instructions = '''
First bring the branch up to date: git fetch origin {base}; when origin/{base} has commits this branch lacks, git rebase --autostash origin/{base}. If the rebase stops on a conflict, git rebase --abort, list the conflicting files and fail.
Then ask the user in one AskUserQuestion form: the type (feat, fix, perf, test, refactor, chore), the scope (the part of the code it touches) and the title, suggesting a scope and a title from the changes.
PUSH.md is the commit message and the PR, so no TLDR or ELI5 in it:
- the title line "<type>(<scope>): <title> #{issue}";
- a short body: what changed and why, from the newest PLAN's Goal and the What changed of the IMPLEMENT and DISCUSS files, ending with "Closes #{issue}" ("Part of" for a sister task; no issue references for a LOCAL task);
- "## Choices", when the newest PLAN lists Options: for each choice, the option taken, the ones set aside in a few words, and why;
- "## Flow": the flow before and after as two mermaid flowcharts (GitHub renders mermaid, not archify), from the newest PLAN's flow diagrams, updated with what was built. About 10 nodes each; mark what changed in the node text, e.g. "(new)" or "(changed)", with no colors, fills, classDef or style lines (unreadable in GitHub's themes). Leave it out when there is no flow to show (docs, config, a one-line fix).
Once PUSH.md is written: commit all the changes with its title line and body as the message (git add -A, then git commit), push the branch (git push --force-with-lease -u origin <branch>), then open a draft pull request against {base} with the same title and body (gh pr create --draft --base {base}), or update the title and body of the one this branch already has (gh pr edit). Copilot reviews it next.'''

[[agent]]
id = "copilot"
name = "Copilot"
trigger = "after:push"
writes = "FEEDBACK-{n}.md"
builtin = true
next = ["explain", "discuss", "impl"]
on_fail = ["impl", "discuss"]

[[agent]]
id = "explain"
name = "Explain"
command = "/jockey:explain {task} -- {guidance}"
model = "sonnet"
effort = "medium"
trigger = "manual"
writes = "EXPLAIN-{n}.md"
next = ["explain", "discuss", "impl"]
on_fail = ["explain"]
instructions = '''
Write EXPLAIN-{n}.md as the best possible explanation of this whole change, in every repository when the task has sister tasks (their run directories and worktrees are in the Jockey step block): clear and intuitive, and thorough enough that the reader never needs to open the diff. Do not be brief: a reviewer should come away knowing exactly what the code now does and why.
Read TASK.md and the newest PLAN, then each repository's diff in full: git diff origin/{base}...HEAD (in a sister task's worktree, its own base), and open the changed files when the diff lacks context.
Structure:
- the TLDR, then the problem and the approach in plain words (ELI5 where something is hard to picture);
- per repository, how it works now: the flow of the new behaviour step by step, naming the real functions, types, endpoints, fields and settings involved; what was added, removed and modified, and why each choice was made over the alternatives;
- per repository, every changed file (git diff --stat) under its own heading or bullet: what it does in the codebase, then each change in it, function by function, with the reason; for tests, what each one proves;
- edge cases, error handling, migrations or config the change touches, and what to check when reviewing.
Add archify diagrams where a picture is clearer than words (flows, sequences, data shapes).
Also write EXPLAIN-{n}.files next to it, in the same folder: the changed files, one path per line (relative to their repository's root), in the order the report goes through them, so Jockey's changed files view follows the explanation.
Write only EXPLAIN-{n}.md and EXPLAIN-{n}.files: never change the code, commit or push.'''
